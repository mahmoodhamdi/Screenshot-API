name: Deploy

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed
    branches: [main]

env:
  NODE_VERSION: '20'

jobs:
  # ============================================
  # Deploy to Staging
  # ============================================
  staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    environment: staging

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to staging
        run: |
          echo "Deploying to staging environment..."
          # Add your staging deployment commands here
          # Examples:
          # - kubectl set image deployment/screenshot-api ...
          # - docker-compose -f docker-compose.staging.yml up -d
          # - ssh user@staging-server 'cd /app && git pull && docker-compose up -d'

      - name: Run smoke tests
        run: |
          echo "Running smoke tests..."
          # Add smoke test commands here
          # curl -f https://staging.screenshot-api.com/health || exit 1

      - name: Notify on success
        if: success()
        run: echo "Staging deployment successful!"

      - name: Notify on failure
        if: failure()
        run: echo "Staging deployment failed!"

  # ============================================
  # Deploy to Production
  # ============================================
  production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: staging
    environment: production
    # Manual approval required for production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to production
        run: |
          echo "Deploying to production environment..."
          # Add your production deployment commands here
          # Examples:
          # - kubectl set image deployment/screenshot-api ...
          # - aws ecs update-service ...
          # - heroku container:push web

      - name: Verify deployment
        run: |
          echo "Verifying production deployment..."
          # curl -f https://api.screenshot-api.com/health || exit 1

      - name: Notify on success
        if: success()
        run: echo "Production deployment successful!"

      - name: Rollback on failure
        if: failure()
        run: |
          echo "Production deployment failed! Initiating rollback..."
          # Add rollback commands here
